[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weider-modbus"
version = "0.1.0"
description = "Async Python library for the Modbus TCP interface of Weider heat pumps, built on modbus-connection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "schadom" }]
requires-python = ">=3.13"
keywords = ["weider", "heat pump", "wt16", "modbus", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
# Only the backend-neutral interface. The consumer (e.g. Home Assistant)
# owns the connection and picks the backend.
dependencies = ["modbus-connection>=4.12.1"]

[project.urls]
Homepage = "https://github.com/schadom/weider-modbus"
Source = "https://github.com/schadom/weider-modbus"
Issues = "https://github.com/schadom/weider-modbus/issues"

[dependency-groups]
dev = [
    "modbus-connection[tmodbus]>=4.12.1",
    "mypy>=1.19",
    "pymodbus>=3.13,<4",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/weider_modbus"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true

[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "SIM", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
